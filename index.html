<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>plantcheck - 生育管理アプリ</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js for Growth Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            emerald: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          },
          fontFamily: {
            sans: ['Inter', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="h-full text-slate-800 flex flex-col font-sans antialiased selection:bg-emerald-200">

  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white text-xl shadow-md shadow-emerald-500/20">
          <i class="fa-solid fa-leaf"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg text-slate-900 tracking-tight flex items-center gap-2">
            plantcheck <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-semibold">生育記録</span>
          </h1>
        </div>
      </div>

      <!-- Auth Section -->
      <div id="auth-header-section" class="flex items-center gap-2">
        <button id="google-login-btn" class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow-sm transition-all cursor-pointer">
          <i class="fa-brands fa-google"></i>
          <span>ログイン</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 space-y-8">

    <!-- Top Alert Notification Box -->
    <div id="error-banner" class="hidden p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation text-base shrink-0"></i>
      <span id="error-banner-text">入力内容に不備があります。</span>
    </div>

    <section class="bg-white p-5 sm:p-7 rounded-3xl border border-slate-200 shadow-sm">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
        <h2 id="form-title" class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-emerald-600"></i> 生育データの記録 (必須5項目)
        </h2>
        <button id="cancel-edit-btn" class="hidden text-xs text-slate-500 hover:text-slate-800 bg-slate-100 px-3 py-1.5 rounded-lg">
          編集をキャンセル
        </button>
      </div>

      <form id="record-form" class="space-y-4">
        <input type="hidden" id="edit-record-id">

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <!-- 項目1: 作物名 -->
          <div>
            <label class="block font-bold text-xs text-slate-700 mb-1">
              1. 作物名 <span class="text-rose-500">*</span>
            </label>
            <input type="text" id="input-crop-name" placeholder="例: トマト, バジル" class="w-full px-3.5 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition-all">
            <p id="err-crop-name" class="text-[11px] text-rose-500 mt-1 hidden"></p>
          </div>

          <!-- 項目2: 葉枚数 (枚) -->
          <div>
            <label class="block font-bold text-xs text-slate-700 mb-1">
              2. 葉枚数 (枚) <span class="text-rose-500">*</span>
            </label>
            <input type="number" id="input-leaf-count" min="0" step="1" placeholder="例: 12" class="w-full px-3.5 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition-all">
            <p id="err-leaf-count" class="text-[11px] text-rose-500 mt-1 hidden"></p>
          </div>

          <!-- 項目3: 草丈 (cm) -->
          <div>
            <label class="block font-bold text-xs text-slate-700 mb-1">
              3. 草丈 (cm) <span class="text-rose-500">*</span>
            </label>
            <input type="number" id="input-height" min="0" step="0.1" placeholder="例: 15.5" class="w-full px-3.5 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition-all">
            <p id="err-height" class="text-[11px] text-rose-500 mt-1 hidden"></p>
          </div>

          <!-- 項目4: 日付 -->
          <div>
            <label class="block font-bold text-xs text-slate-700 mb-1">
              4. 日付 <span class="text-rose-500">*</span>
            </label>
            <input type="date" id="input-date" class="w-full px-3.5 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition-all">
            <p id="err-date" class="text-[11px] text-rose-500 mt-1 hidden"></p>
          </div>
        </div>

        <!-- 項目5: メモ (複数行) -->
        <div>
          <label class="block font-bold text-xs text-slate-700 mb-1">
            5. メモ (複数行テキスト)
          </label>
          <textarea id="input-memo" rows="2" placeholder="新芽が出て良好。追肥を実施した。" class="w-full px-3.5 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition-all resize-none"></textarea>
        </div>

        <!-- 保存ボタン -->
        <div class="flex justify-end pt-2">
          <button type="submit" id="save-btn" class="w-full sm:w-auto px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm rounded-xl shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-95">
            <i class="fa-solid fa-floppy-disk"></i>
            <span id="save-btn-text">データを保存する</span>
          </button>
        </div>
      </form>
    </section>

    <section class="bg-white p-5 sm:p-7 rounded-3xl border border-slate-200 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-chart-line text-emerald-600"></i> 生育推移グラフ (草丈 & 葉枚数)
        </h2>
        <select id="graph-crop-filter" class="px-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none">
          <option value="ALL">すべての作物</option>
        </select>
      </div>
      <div class="h-64 w-full">
        <canvas id="growthChart"></canvas>
      </div>
    </section>

    <section class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-emerald-600"></i> 保存データ一覧
          <span id="record-count-badge" class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-normal">0 件</span>
        </h2>

        <div class="flex flex-wrap items-center gap-2">
          <!-- 作物名で絞り込み -->
          <div class="relative min-w-[140px]">
            <i class="fa-solid fa-filter absolute left-3 top-2.5 text-slate-400 text-xs"></i>
            <select id="filter-crop-name" class="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:bg-white">
              <option value="ALL">すべての作物</option>
            </select>
          </div>

          <!-- 日付順並べ替え -->
          <div class="relative min-w-[140px]">
            <i class="fa-solid fa-sort absolute left-3 top-2.5 text-slate-400 text-xs"></i>
            <select id="sort-order" class="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:bg-white">
              <option value="DESC">日付: 新しい順</option>
              <option value="ASC">日付: 古い順</option>
            </select>
          </div>
        </div>
      </div>

      <div id="records-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Records render dynamically -->
      </div>

      <div id="empty-state" class="hidden text-center py-12 bg-white rounded-3xl border border-dashed border-slate-300 p-6">
        <i class="fa-solid fa-seedling text-3xl text-emerald-500 mb-2"></i>
        <p class="text-sm font-bold text-slate-700">登録された生育データはありません</p>
        <p class="text-xs text-slate-400 mt-1">上のフォームから最初のデータを追加してみましょう！</p>
      </div>
    </section>

  </main>

  <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center space-y-4">
      <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h3 class="font-bold text-slate-800">データの削除確認</h3>
      <p class="text-xs text-slate-500">この生育記録を削除してもよろしいですか？</p>
      <div class="flex items-center justify-center gap-3 pt-2">
        <button id="confirm-cancel-btn" class="px-4 py-2 bg-slate-100 text-slate-700 font-semibold rounded-xl text-xs cursor-pointer">キャンセル</button>
        <button id="confirm-ok-btn" class="px-4 py-2 bg-rose-600 text-white font-bold rounded-xl text-xs cursor-pointer">削除する</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Firebase Configuration from User Prompt
    const firebaseConfig = {
      apiKey: "AIzaSyBwPgMieSCl3hC43t8I52DTuBGt5TT3gpA",
      authDomain: "seiikukannri-ccec3.firebaseapp.com",
      projectId: "seiikukannri-ccec3",
      storageBucket: "seiikukannri-ccec3.firebasestorage.app",
      messagingSenderId: "602471885111",
      appId: "1:602471885111:web:35967243795a8a235a52b2"
    };

    // Initialize Services
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // App State
    let currentUser = null;
    let recordsList = [];
    let growthChartInstance = null;
    let unsubscribeRecords = null;

    // Set today as default date in input
    document.getElementById('input-date').value = new Date().toISOString().split('T')[0];

    // Auth Listeners
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      renderHeaderAuthUI(user);
      subscribeToRecords(user ? user.uid : 'public-guest-id');
    });

    function renderHeaderAuthUI(user) {
      const authSection = document.getElementById('auth-header-section');
      if (user) {
        authSection.innerHTML = `
          <div class="flex items-center gap-2">
            <img src="${user.photoURL || 'https://via.placeholder.com/32'}" class="w-8 h-8 rounded-full border border-slate-200">
            <span class="text-xs font-semibold text-slate-700 hidden sm:inline">${user.displayName || 'ユーザー'}</span>
            <button id="logout-btn" class="text-xs text-slate-500 hover:text-slate-800 bg-slate-100 px-3 py-1.5 rounded-lg transition-all cursor-pointer">ログアウト</button>
          </div>
        `;
        document.getElementById('logout-btn')?.addEventListener('click', () => signOut(auth));
      } else {
        authSection.innerHTML = `
          <button id="google-login-btn" class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow-sm transition-all cursor-pointer">
            <i class="fa-brands fa-google"></i>
            <span>Google ログイン</span>
          </button>
        `;
        document.getElementById('google-login-btn')?.addEventListener('click', async () => {
          try {
            await signInWithPopup(auth, googleProvider);
            showToast("ログインしました", "success");
          } catch(err) {
            showToast("ログインに失敗しました", "error");
          }
        });
      }
    }

    function subscribeToRecords(userId) {
      const recordsCol = collection(db, 'artifacts', 'plantcheck', 'public', 'data', 'records');

      if (unsubscribeRecords) unsubscribeRecords();

      unsubscribeRecords = onSnapshot(recordsCol, (snapshot) => {
        recordsList = [];
        snapshot.forEach((doc) => {
          recordsList.push({ id: doc.id, ...doc.data() });
        });

        updateCropDropdowns();
        renderRecordsList();
        renderChart();
      }, (error) => {
        console.error("Firestore error:", error);
      });
    }

    // Update Filter and Graph Crop Selector Options
    function updateCropDropdowns() {
      const filterSelect = document.getElementById('filter-crop-name');
      const graphSelect = document.getElementById('graph-crop-filter');

      const currentFilter = filterSelect.value;
      const currentGraph = graphSelect.value;

      const crops = Array.from(new Set(recordsList.map(r => r.cropName).filter(Boolean)));

      filterSelect.innerHTML = `<option value="ALL">すべての作物</option>` + crops.map(c => `<option value="${c}">${c}</option>`).join('');
      graphSelect.innerHTML = `<option value="ALL">すべての作物</option>` + crops.map(c => `<option value="${c}">${c}</option>`).join('');

      filterSelect.value = crops.includes(currentFilter) ? currentFilter : "ALL";
      graphSelect.value = crops.includes(currentGraph) ? currentGraph : "ALL";
    }

    const form = document.getElementById('record-form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Form values
      const recordId = document.getElementById('edit-record-id').value;
      const cropName = document.getElementById('input-crop-name').value.trim();
      const leafCountRaw = document.getElementById('input-leaf-count').value;
      const heightRaw = document.getElementById('input-height').value;
      const date = document.getElementById('input-date').value;
      const memo = document.getElementById('input-memo').value.trim();

      // Validation check
      let isValid = true;
      resetValidationErrors();

      if (!cropName) {
        showFieldError('input-crop-name', 'err-crop-name', '作物名を入力してください');
        isValid = false;
      }
      if (leafCountRaw === '' || isNaN(leafCountRaw) || Number(leafCountRaw) < 0) {
        showFieldError('input-leaf-count', 'err-leaf-count', '0以上の数値を入力してください');
        isValid = false;
      }
      if (heightRaw === '' || isNaN(heightRaw) || Number(heightRaw) < 0) {
        showFieldError('input-height', 'err-height', '0以上の数値を入力してください');
        isValid = false;
      }
      if (!date) {
        showFieldError('input-date', 'err-date', '日付を選択してください');
        isValid = false;
      }

      if (!isValid) {
        document.getElementById('error-banner').classList.remove('hidden');
        return;
      }

      document.getElementById('error-banner').classList.add('hidden');

      const dataPayload = {
        cropName,
        leafCount: Number(leafCountRaw),
        height: Number(heightRaw),
        date,
        memo,
        updatedAt: serverTimestamp()
      };

      try {
        if (recordId) {
          // Update existing
          await updateDoc(doc(db, 'artifacts', 'plantcheck', 'public', 'data', 'records', recordId), dataPayload);
          showToast("記録を更新しました", "success");
        } else {
          // Create new
          dataPayload.createdAt = serverTimestamp();
          await addDoc(collection(db, 'artifacts', 'plantcheck', 'public', 'data', 'records'), dataPayload);
          showToast("新しくデータを登録しました！", "success");
        }

        resetForm();
      } catch (err) {
        console.error(err);
        showToast("保存に失敗しました", "error");
      }
    });

    function showFieldError(inputId, errId, msg) {
      const input = document.getElementById(inputId);
      const err = document.getElementById(errId);
      input.classList.add('border-rose-500', 'bg-rose-50');
      err.textContent = msg;
      err.classList.remove('hidden');
    }

    function resetValidationErrors() {
      ['input-crop-name', 'input-leaf-count', 'input-height', 'input-date'].forEach(id => {
        document.getElementById(id).classList.remove('border-rose-500', 'bg-rose-50');
      });
      ['err-crop-name', 'err-leaf-count', 'err-height', 'err-date'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById('error-banner').classList.add('hidden');
    }

    function resetForm() {
      form.reset();
      document.getElementById('edit-record-id').value = '';
      document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-emerald-600"></i> 生育データの記録 (必須5項目)`;
      document.getElementById('save-btn-text').textContent = 'データを保存する';
      document.getElementById('cancel-edit-btn').classList.add('hidden');
      resetValidationErrors();
    }

    document.getElementById('cancel-edit-btn').addEventListener('click', resetForm);

    function renderRecordsList() {
      const container = document.getElementById('records-list');
      const emptyState = document.getElementById('empty-state');
      const filterCrop = document.getElementById('filter-crop-name').value;
      const sortOrder = document.getElementById('sort-order').value;

      let filtered = recordsList.filter(r => filterCrop === 'ALL' || r.cropName === filterCrop);

      // Sort by Date
      filtered.sort((a, b) => {
        const dA = new Date(a.date);
        const dB = new Date(b.date);
        return sortOrder === 'DESC' ? dB - dA : dA - dB;
      });

      document.getElementById('record-count-badge').textContent = `${filtered.length} 件`;

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      container.innerHTML = filtered.map(item => `
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all flex flex-col justify-between space-y-3">
          <div>
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-emerald-100 text-emerald-800">
                ${item.cropName}
              </span>
              <span class="text-xs font-semibold text-slate-500">
                <i class="fa-regular fa-calendar mr-1"></i>${item.date}
              </span>
            </div>

            <div class="grid grid-cols-2 gap-2 my-3">
              <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-100 text-center">
                <div class="text-[11px] text-slate-400 font-semibold">葉枚数</div>
                <div class="text-lg font-black text-slate-800">${item.leafCount} <span class="text-xs font-normal">枚</span></div>
              </div>
              <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-100 text-center">
                <div class="text-[11px] text-slate-400 font-semibold">草丈</div>
                <div class="text-lg font-black text-emerald-600">${item.height} <span class="text-xs font-normal">cm</span></div>
              </div>
            </div>

            ${item.memo ? `
              <div class="text-xs text-slate-600 bg-amber-50/60 border border-amber-100 p-2.5 rounded-xl whitespace-pre-wrap">
                <i class="fa-solid fa-note-sticky text-amber-500 mr-1"></i>${item.memo}
              </div>
            ` : ''}
          </div>

          <div class="pt-2 border-t border-slate-100 flex items-center justify-end gap-2 text-xs">
            <button onclick="editRecord('${item.id}')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg transition-all cursor-pointer">
              <i class="fa-solid fa-pen mr-1"></i>編集
            </button>
            <button onclick="confirmDelete('${item.id}')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded-lg transition-all cursor-pointer">
              <i class="fa-solid fa-trash mr-1"></i>削除
            </button>
          </div>
        </div>
      `).join('');
    }

    // Attach Edit / Delete to window object
    window.editRecord = function(id) {
      const record = recordsList.find(r => r.id === id);
      if (!record) return;

      document.getElementById('edit-record-id').value = record.id;
      document.getElementById('input-crop-name').value = record.cropName;
      document.getElementById('input-leaf-count').value = record.leafCount;
      document.getElementById('input-height').value = record.height;
      document.getElementById('input-date').value = record.date;
      document.getElementById('input-memo').value = record.memo || '';

      document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen text-amber-600"></i> 生育データの編集`;
      document.getElementById('save-btn-text').textContent = '変更を更新する';
      document.getElementById('cancel-edit-btn').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.confirmDelete = function(id) {
      const confirmModal = document.getElementById('confirm-modal');
      confirmModal.classList.remove('hidden');

      const okBtn = document.getElementById('confirm-ok-btn');
      const cancelBtn = document.getElementById('confirm-cancel-btn');

      const onOk = async () => {
        try {
          await deleteDoc(doc(db, 'artifacts', 'plantcheck', 'public', 'data', 'records', id));
          showToast("データを削除しました", "info");
        } catch(err) {
          showToast("削除エラーが発生しました", "error");
        }
        cleanup();
      };

      const cleanup = () => {
        confirmModal.classList.add('hidden');
        okBtn.removeEventListener('click', onOk);
      };

      okBtn.addEventListener('click', onOk);
      cancelBtn.onclick = cleanup;
    };

    // Listeners for Filter / Sort
    document.getElementById('filter-crop-name').addEventListener('change', renderRecordsList);
    document.getElementById('sort-order').addEventListener('change', renderRecordsList);
    document.getElementById('graph-crop-filter').addEventListener('change', renderChart);

    function renderChart() {
      const ctx = document.getElementById('growthChart').getContext('2d');
      const cropFilter = document.getElementById('graph-crop-filter').value;

      let filtered = recordsList.filter(r => cropFilter === 'ALL' || r.cropName === cropFilter);
      filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

      const labels = filtered.map(r => `${r.date} (${r.cropName})`);
      const heightData = filtered.map(r => r.height);
      const leafData = filtered.map(r => r.leafCount);

      if (growthChartInstance) {
        growthChartInstance.destroy();
      }

      growthChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '草丈 (cm)',
              data: heightData,
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.1)',
              yAxisID: 'yHeight',
              tension: 0.3,
              fill: true
            },
            {
              label: '葉枚数 (枚)',
              data: leafData,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59, 130, 246, 0.1)',
              yAxisID: 'yLeaves',
              tension: 0.3,
              borderDash: [5, 5]
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { grid: { display: false } },
            yHeight: {
              type: 'linear',
              display: true,
              position: 'left',
              title: { display: true, text: '草丈 (cm)' },
              beginAtZero: true
            },
            yLeaves: {
              type: 'linear',
              display: true,
              position: 'right',
              title: { display: true, text: '葉枚数 (枚)' },
              beginAtZero: true,
              grid: { drawOnChartArea: false }
            }
          }
        }
      });
    }

    // Helper Toast System
    function showToast(message, type = "info") {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');

      const bgColors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        info: 'bg-slate-800 text-white'
      };

      toast.className = `${bgColors[type]} text-xs px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `<span>${message}</span>`;

      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
